name: Auto Update Sports M3U

on:
  schedule:
    - cron: '0 */12 * * *' # প্রতি ১২ ঘণ্টা পর পর অটো আপডেট হবে
  workflow_dispatch: # চাইলে আপনি নিজেও বাটন চেপে আপডেট করতে পারবেন

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Filter Script
        run: python filter.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sports.m3u
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-updated Sports playlist"
          git push
